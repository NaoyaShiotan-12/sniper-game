<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TACTICAL SNIPER</title>
<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#030903;
    font-family:Consolas,monospace;
    color:#00ff88;
    user-select:none;
}
body{
    cursor:none;
    background:
    linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.75)),
    url("images/bg.jpg") center center / cover no-repeat fixed;
  
}

.char-img{
    width:100%;
    height:100%;
    object-fit:contain;
    pointer-events:none;
    user-select:none;
}
#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    transform-origin:center center;
}
#scopeMask{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:90;
    background:
    radial-gradient(circle 280px at center,
    transparent 0%,
    transparent 70%,
    rgba(0,0,0,.45) 71%,
    rgba(0,0,0,.85) 100%);
}
#scopeCircle{
    position:fixed;
    width:560px;
    height:560px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:1px solid rgba(0,255,120,.45);
    pointer-events:none;
    z-index:91;
    box-shadow:
    0 0 30px rgba(0,255,120,.25),
    inset 0 0 60px rgba(0,255,120,.1);
}
#scopeCircle:before,#scopeCircle:after{
    content:"";
    position:absolute;
    background:rgba(0,255,120,.45);
}
#scopeCircle:before{
    width:1px;
    height:100%;
    left:50%;
}
#scopeCircle:after{
    height:1px;
    width:100%;
    top:50%;
}
#dot{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    background:#00ff88;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 0 12px #00ff88;
}
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.92);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:500;
    text-align:center;
}
.title{
    font-size:64px;
    letter-spacing:8px;
    color:#66ff99;
    text-shadow:0 0 25px #00ff88;
}
.subtitle{
    margin-top:10px;
    margin-bottom:45px;
    color:#99ffcc;
    letter-spacing:4px;
}
.btn{
    border:2px solid #00ff88;
    background:transparent;
    color:#00ff88;
    padding:16px 38px;
    font-size:22px;
    cursor:pointer;
    transition:.2s;
    font-family:inherit;
}
.btn:hover{
    background:#00ff88;
    color:#001a00;
    box-shadow:0 0 25px #00ff88;
}
#hud{
    position:fixed;
    top:20px;
    left:25px;
    z-index:120;
    font-size:20px;
    line-height:1.7;
    text-shadow:0 0 10px rgba(0,255,120,.5);
}
#comboBox{
    position:fixed;
    right:35px;
    top:20px;
    z-index:120;
    text-align:right;
    display:none;
}
#comboText{
    font-size:30px;
    color:#00eaff;
    text-shadow:0 0 12px #00eaff;
}
#comboMulti{
    font-size:16px;
    color:#fff;
}
#comboBar{
    width:150px;
    height:8px;
    border:1px solid #00eaff;
    margin-top:6px;
    background:rgba(0,80,100,.35);
    overflow:hidden;
}
#comboBarInner{
    width:100%;
    height:100%;
    background:#00eaff;
}
#reloadBtn{
    position:fixed;
    top:18px;
    left:18px;
    z-index:140;
    border:1px solid rgba(255,255,255,.3);
    background:rgba(0,0,0,.25);
    color:rgba(255,255,255,.7);
    padding:10px 18px;
    font-weight:bold;
    cursor:pointer;
    backdrop-filter:blur(3px);
}
#reloadBtn:hover{
    background:rgba(0,255,120,.18);
    color:#fff;
}
#reloadUI{
    position:fixed;
    left:50%;
    top:58%;
    transform:translate(-50%,-50%);
    z-index:180;
    display:none;
    text-align:center;
    color:#ffee66;
    font-size:24px;
    text-shadow:0 0 14px #ffee66;
}
#reloadBar{
    width:240px;
    height:12px;
    border:1px solid #ffee66;
    margin-top:10px;
    overflow:hidden;
    background:rgba(255,255,0,.12);
}
#reloadBarInner{
    width:0%;
    height:100%;
    background:#ffee66;
}
.target{
    position:absolute;
    width:110px;
    height:110px;
    display:flex;
    justify-content:center;
    align-items:center;
    transform-origin:center center;
    z-index:40;
    filter:drop-shadow(0 0 14px rgba(0,0,0,.6));
}
.target span{
    font-size:78px;
}
.floatText{
    position:absolute;
    z-index:300;
    font-weight:bold;
    pointer-events:none;
    animation:floatUp .7s ease-out forwards;
    white-space:nowrap;
}
@keyframes floatUp{
    0%{opacity:1;transform:translate(-50%,-50%) scale(.8)}
    100%{opacity:0;transform:translate(-50%,-140%) scale(1.25)}
}
.flash{
    position:absolute;
    width:150px;
    height:150px;
    border-radius:50%;
    background:
    radial-gradient(circle,
    rgba(255,255,255,1) 0%,
    rgba(255,200,80,.9) 20%,
    rgba(255,120,0,.6) 45%,
    transparent 70%);
    pointer-events:none;
    z-index:200;
    transform:translate(-50%,-50%);
    animation:flash .08s linear forwards;
}
@keyframes flash{
    from{opacity:1;transform:translate(-50%,-50%) scale(.2)}
    to{opacity:0;transform:translate(-50%,-50%) scale(1.8)}
}
.damageOverlay{
    animation:damageFlash .3s;
}
@keyframes damageFlash{
    0%{background-color:rgba(255,0,0,.3)}
    100%{background-color:transparent}
}
.recoil{
    animation:recoil .13s ease-out;
}
@keyframes recoil{
    0%{transform:translateY(0px) scale(1)}
    20%{transform:translateY(-35px) scale(1.03)}
    60%{transform:translateY(8px) scale(1.01)}
    100%{transform:translateY(0px)}
}
#ranking{
    width:320px;
    margin:25px 0;
}
.rank{
    display:flex;
    justify-content:space-between;
    margin:10px 0;
    color:#8effbc;
}
.rank.you{
    color:#ffee33;
    text-shadow:0 0 12px #ffee33;
    font-size:20px;
}
#crosshair{
    position:fixed;
    width:24px;
    height:24px;
    border:1px solid rgba(0,255,120,.8);
    border-radius:50%;
    pointer-events:none;
    z-index:999;
    transform:translate(-50%,-50%);
}
#crosshair:before,#crosshair:after{
    content:"";
    position:absolute;
    background:#00ff88;
}
#crosshair:before{
    width:1px;height:24px;left:50%;
}
#crosshair:after{
    width:24px;height:1px;top:50%;
}
.scanline{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:95;
    background:linear-gradient(rgba(255,255,255,.02),rgba(255,255,255,0));
    background-size:100% 4px;
    mix-blend-mode:screen;
}
</style>
</head>
<body oncontextmenu="return false">

<div id="crosshair"></div>
<div class="scanline"></div>

<div id="titleScreen" class="overlay">
    <div class="title">TACTICAL SNIPER</div>
    <div class="subtitle">NIGHT VISION ELITE OPERATION</div>
    <button class="btn" id="startBtn">MISSION START</button>
</div>

<div id="resultScreen" class="overlay" style="display:none">
    <div class="title" id="resultTitle">MISSION FAILED</div>
    <div style="margin-top:20px;font-size:28px;color:#ffee55" id="finalScore">SCORE 0000</div>
    <div style="margin-top:18px;color:#77ffaa">LOCAL TOP RANKING</div>
    <div id="ranking"></div>
    <button class="btn" id="retryBtn">REDEPLOY (RETRY)</button>
</div>

<div id="hud">
    SCORE : <span id="score">0000</span><br>
    LIFE : <span id="life">❤️❤️❤️</span><br>
    AMMO : <span id="ammo">⚡⚡⚡⚡⚡</span>
</div>

<div id="comboBox">
    <div id="comboText">2 COMBO!</div>
    <div id="comboMulti">x1.5</div>
    <div id="comboBar"><div id="comboBarInner"></div></div>
</div>

<button id="reloadBtn">[R] RE-LOAD</button>

<div id="reloadUI">
    RELOADING...
    <div id="reloadBar">
        <div id="reloadBarInner"></div>
    </div>
</div>

<div id="game">
    <div id="scopeMask"></div>
    <div id="scopeCircle"><div id="dot"></div></div>
</div>

<script>
const game=document.getElementById("game");
const scoreEl=document.getElementById("score");
const lifeEl=document.getElementById("life");
const ammoEl=document.getElementById("ammo");
const comboBox=document.getElementById("comboBox");
const comboText=document.getElementById("comboText");
const comboMulti=document.getElementById("comboMulti");
const comboBarInner=document.getElementById("comboBarInner");
const reloadUI=document.getElementById("reloadUI");
const reloadBarInner=document.getElementById("reloadBarInner");
const resultScreen=document.getElementById("resultScreen");
const resultTitle=document.getElementById("resultTitle");
const finalScore=document.getElementById("finalScore");
const ranking=document.getElementById("ranking");
const crosshair=document.getElementById("crosshair");

const audioCtx=new(window.AudioContext||window.webkitAudioContext)();

let running=false;
let score=0;
let life=3;
let ammo=5;
let maxAmmo=5;
let reloading=false;
let combo=0;
let comboExpire=0;
let spawnLoop;
let targets=[];
let comboAnim;
let lastComboKill=0;

document.addEventListener("mousemove",e=>{
    crosshair.style.left=e.clientX+"px";
    crosshair.style.top=e.clientY+"px";
});

function synth(type){
    if(audioCtx.state==="suspended")audioCtx.resume();

    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    const filter=audioCtx.createBiquadFilter();

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);

    const now=audioCtx.currentTime;

    if(type==="gun"){
        osc.type="sawtooth";
        osc.frequency.setValueAtTime(180,now);
        osc.frequency.exponentialRampToValueAtTime(40,now+.09);
        gain.gain.setValueAtTime(.55,now);
        gain.gain.exponentialRampToValueAtTime(.001,now+.12);
        filter.type="lowpass";
        filter.frequency.value=900;
        osc.start(now);
        osc.stop(now+.12);
    }
    if(type==="empty"){
        osc.type="square";
        osc.frequency.value=700;
        gain.gain.setValueAtTime(.08,now);
        gain.gain.exponentialRampToValueAtTime(.001,now+.04);
        osc.start(now);
        osc.stop(now+.04);
    }
    if(type==="reload"){
        osc.type="triangle";
        osc.frequency.setValueAtTime(220,now);
        osc.frequency.linearRampToValueAtTime(500,now+.14);
        gain.gain.setValueAtTime(.18,now);
        gain.gain.exponentialRampToValueAtTime(.001,now+.15);
        osc.start(now);
        osc.stop(now+.15);
    }
    if(type==="reloadDone"){
        osc.type="sine";
        osc.frequency.setValueAtTime(500,now);
        osc.frequency.exponentialRampToValueAtTime(1200,now+.18);
        gain.gain.setValueAtTime(.2,now);
        gain.gain.exponentialRampToValueAtTime(.001,now+.2);
        osc.start(now);
        osc.stop(now+.2);
    }
    if(type==="damage"){
        osc.type="sawtooth";
        osc.frequency.setValueAtTime(120,now);
        osc.frequency.linearRampToValueAtTime(50,now+.35);
        gain.gain.setValueAtTime(.45,now);
        gain.gain.linearRampToValueAtTime(.001,now+.35);
        osc.start(now);
        osc.stop(now+.35);
    }
    if(type==="combo"){
        osc.type="sine";
        osc.frequency.setValueAtTime(900+combo*80,now);
        gain.gain.setValueAtTime(.15,now);
        gain.gain.exponentialRampToValueAtTime(.001,now+.08);
        osc.start(now);
        osc.stop(now+.08);
    }
    if(type==="armor"){
        osc.type="square";
        osc.frequency.setValueAtTime(260,now);
        osc.frequency.linearRampToValueAtTime(120,now+.08);
        gain.gain.setValueAtTime(.22,now);
        gain.gain.exponentialRampToValueAtTime(.001,now+.12);
        osc.start(now);
        osc.stop(now+.12);
    }
}

function startGame(){
    document.getElementById("titleScreen").style.display="none";
    resultScreen.style.display="none";

    running=true;
    score=0;
    life=3;
    ammo=5;
    combo=0;
    reloading=false;

    updateUI();

    targets.forEach(t=>t.el.remove());
    targets=[];

    spawnLoop=setInterval(spawnTarget,850);

    requestAnimationFrame(gameLoop);
}

function updateUI(){
    scoreEl.textContent=String(score).padStart(4,"0");
    lifeEl.innerHTML="❤️".repeat(life)+"🖤".repeat(3-life);
    ammoEl.textContent="⚡".repeat(ammo)+"・".repeat(maxAmmo-ammo);
}

function createText(x,y,text,color,size=28){
    const d=document.createElement("div");
    d.className="floatText";
    d.style.left=x+"px";
    d.style.top=y+"px";
    d.style.color=color;
    d.style.fontSize=size+"px";
    d.style.textShadow=`0 0 12px ${color}`;
    d.textContent=text;
    game.appendChild(d);
    setTimeout(()=>d.remove(),700);
}

function flash(x,y){
    const f=document.createElement("div");
    f.className="flash";
    f.style.left=x+"px";
    f.style.top=y+"px";
    game.appendChild(f);
    setTimeout(()=>f.remove(),90);
}

function recoil(){
    game.classList.remove("recoil");
    void game.offsetWidth;
    game.classList.add("recoil");
}

function resetCombo(){
    combo=0;
    comboBox.style.display="none";
    cancelAnimationFrame(comboAnim);
}

function beginComboTimer(){
    comboExpire=performance.now()+2000;
    comboBox.style.display="block";

    function tick(){
        if(!running)return;
        let remain=Math.max(0,comboExpire-performance.now());
        comboBarInner.style.width=(remain/2000*100)+"%";
        if(remain<=0){
            resetCombo();
            return;
        }
        comboAnim=requestAnimationFrame(tick);
    }
    cancelAnimationFrame(comboAnim);
    tick();
}

function multiplier(){
    if(combo<=1)return 1;
    if(combo===2)return 1.5;
    return 2;
}

function shoot(e,targetObj=null){
    if(!running)return;

    if(reloading){
        synth("empty");
        return;
    }

    if(ammo<=0){
        synth("empty");
        createText(e.clientX,e.clientY,"EMPTY!", "#ffee55");
        reload();
        return;
    }

    ammo--;
    updateUI();

    synth("gun");
    flash(e.clientX,e.clientY);
    recoil();

    if(!targetObj){
        resetCombo();
        return;
    }

    const t=targetObj;

    if(t.type==="hostage"){
        createText(e.clientX,e.clientY,"HOSTAGE HIT!","#ff3333");
        synth("damage");
        setTimeout(()=>gameOver("HOSTAGE KILLED"),250);
        return;
    }

    if(t.type==="heavy" && t.hp===2){
        t.hp=1;
        t.el.innerHTML='<img src="images/enemy.png" class="char-img">';
        synth("armor");
        createText(e.clientX,e.clientY,"ARMOR BREAK!","#ffee55");
        return;
    }

    clearTimeout(t.attackTimer);

    combo++;
    beginComboTimer();

    let gain=Math.floor(t.points*multiplier());

    score+=gain;

    comboText.textContent=combo+" COMBO!";
    comboMulti.textContent="x"+multiplier().toFixed(1);

    if(combo>1){
        synth("combo");
        createText(e.clientX,e.clientY,`+${gain} (${combo} COMBO!)`,"#00eaff");
    }else{
        createText(e.clientX,e.clientY,"+"+gain,"#00ff88");
    }

    updateUI();

    removeTarget(t);
}

function reload(){
    if(reloading||ammo===maxAmmo||!running)return;

    reloading=true;
    resetCombo();
    synth("reload");

    reloadUI.style.display="block";
    const start=performance.now();

    function anim(now){
        let p=Math.min((now-start)/1200,1);
        reloadBarInner.style.width=(p*100)+"%";

        if(p<1){
            requestAnimationFrame(anim);
        }else{
            ammo=maxAmmo;
            reloading=false;
            reloadUI.style.display="none";
            reloadBarInner.style.width="0%";
            synth("reloadDone");
            updateUI();
        }
    }
    requestAnimationFrame(anim);
}

function damage(){
    if(!running)return;

    life--;
    resetCombo();
    updateUI();

    synth("damage");

    document.body.classList.add("damageOverlay");
    setTimeout(()=>document.body.classList.remove("damageOverlay"),300);

    createText(window.innerWidth/2,window.innerHeight/2,"⚠️DAMAGED⚠️","#ff3333",40);

    if(life<=0){
        gameOver("MISSION FAILED");
    }
}

function spawnTarget(){
    if(!running)return;

    const t={};
    const el=document.createElement("div");
    el.className="target";

    let r=Math.random();

    if(r<0.22){
        t.type="hostage";
        t.hp=1;
        t.points=0;
        el.innerHTML='<img src="images/hostage.png" class="char-img">';
    }else if(r<0.52){
        t.type="heavy";
        t.hp=2;
        t.points=300;
        el.innerHTML='<img src="images/heavy.png" class="char-img">';
    }else{
        t.type="enemy";
        t.hp=1;
        t.points=100;
        el.innerHTML='<img src="images/enemy.png" class="char-img">';
    }

    let x=Math.random()*(window.innerWidth-300)+150;
    let y=Math.random()*(window.innerHeight-260)+130;

    t.x=x;
    t.y=y;
    t.scale=t.type==="heavy"?0.7:1;
    t.vx=(Math.random()-.5)*2;
    t.vy=(Math.random()-.5)*2;
    t.el=el;

    el.style.left=x+"px";
    el.style.top=y+"px";
    el.style.transform=`translate(-50%,-50%) scale(${t.scale})`;

    el.addEventListener("click",ev=>{
        ev.stopPropagation();
        shoot(ev,t);
    });

    game.appendChild(el);

    if(t.type!=="hostage"){
        t.attackTimer=setTimeout(()=>{
            if(running){
                damage();
                removeTarget(t);
            }
        },1500+Math.random()*500);
    }

    targets.push(t);

    setTimeout(()=>{
        if(targets.includes(t))removeTarget(t);
    },4200);
}

function removeTarget(t){
    if(t.attackTimer)clearTimeout(t.attackTimer);
    if(t.el)t.el.remove();
    targets=targets.filter(a=>a!==t);
}

function gameLoop(){
    if(!running)return;

    const mx=parseFloat(crosshair.style.left)||window.innerWidth/2;
    const my=parseFloat(crosshair.style.top)||window.innerHeight/2;

    targets.forEach(t=>{

        if(t.type==="enemy"){
            let dx=t.x-mx;
            let dy=t.y-my;
            let dist=Math.hypot(dx,dy)||1;

            t.vx+=dx/dist*.12+(Math.random()-.5)*.4;
            t.vy+=dy/dist*.12+(Math.random()-.5)*.4;

            t.vx*=.95;
            t.vy*=.95;

            t.x+=t.vx;
            t.y+=t.vy;
        }

        if(t.type==="heavy"){
            let dx=window.innerWidth/2-t.x;
            let dy=window.innerHeight/2-t.y;

            t.x+=dx*.0025;
            t.y+=dy*.0025;

            t.scale+=0.0018;
            if(t.scale>1.5)t.scale=1.5;

            t.vx+=(Math.random()-.5)*.15;
            t.vy+=(Math.random()-.5)*.15;

            t.x+=t.vx;
            t.y+=t.vy;
        }

        if(t.type==="hostage"){
            if(!t.dir){
                const edge=Math.floor(Math.random()*4);

                if(edge===0){t.vx=-8;t.vy=(Math.random()-.5)*3}
                if(edge===1){t.vx=8;t.vy=(Math.random()-.5)*3}
                if(edge===2){t.vx=(Math.random()-.5)*3;t.vy=-8}
                if(edge===3){t.vx=(Math.random()-.5)*3;t.vy=8}

                t.dir=true;
            }

            t.x+=t.vx;
            t.y+=t.vy;

            if(t.x<-200||t.x>window.innerWidth+200||t.y<-200||t.y>window.innerHeight+200){
                removeTarget(t);
            }
        }

        t.x=Math.max(60,Math.min(window.innerWidth-60,t.x));
        t.y=Math.max(60,Math.min(window.innerHeight-60,t.y));

        t.el.style.left=t.x+"px";
        t.el.style.top=t.y+"px";
        t.el.style.transform=`translate(-50%,-50%) scale(${t.scale})`;
    });

    requestAnimationFrame(gameLoop);
}

function saveRanking(current){
    let arr=JSON.parse(localStorage.getItem("sniperRank")||"[]");
    arr.push(current);
    arr.sort((a,b)=>b-a);
    arr=arr.slice(0,5);

    localStorage.setItem("sniperRank",JSON.stringify(arr));

    ranking.innerHTML="";
    let used=false;

    arr.forEach((s,i)=>{
        const d=document.createElement("div");
        d.className="rank";

        if(!used && s===current){
            d.classList.add("you");
            d.innerHTML=`<span>RANK ${i+1} (YOU)</span><span>${s} PTS</span>`;
            used=true;
        }else{
            d.innerHTML=`<span>RANK ${i+1}</span><span>${s} PTS</span>`;
        }

        ranking.appendChild(d);
    });
}

function gameOver(reason){
    running=false;
    clearInterval(spawnLoop);

    targets.forEach(t=>{
        clearTimeout(t.attackTimer);
        if(t.el)t.el.remove();
    });

    targets=[];

    resultTitle.textContent=reason;
    finalScore.textContent="FINAL SCORE : "+String(score).padStart(4,"0");

    saveRanking(score);

    resultScreen.style.display="flex";
}

window.addEventListener("click",e=>{
    if(!running)return;
    shoot(e,null);
});

window.addEventListener("contextmenu",e=>{
    e.preventDefault();
    reload();
});

document.getElementById("reloadBtn").addEventListener("click",e=>{
    e.stopPropagation();
    reload();
});

document.getElementById("startBtn").addEventListener("click",()=>{
    startGame();
});

document.getElementById("retryBtn").addEventListener("click",()=>{
    startGame();
});
</script>
